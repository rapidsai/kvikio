PluginName: kvikio_nic
FeatureName: Collect KvikIO NIC bandwidth
ExecutablePath: kvikio_nic_nsys_plugin
Description: Per-interface RX/TX network bandwidth from /sys/class/net, as NVTX counter groups.
ExtendedDescription: |
  Command line options:
    -i | --interval  Sampling interval in microseconds (default 20000)
    -d | --device    Interface name regex, matched against the whole name
                     (default: all up or unknown, non-loopback interfaces)
    -h | --help      Print this help message

  Plugin arguments follow the plugin name as a comma separated list (commas only, no
  spaces). Each comma separated token is passed verbatim as one argument. These are
  equivalent:
    --enable=kvikio_nic,-d,eth0,-i,20000
    --enable=kvikio_nic,-deth0,-i20000
    --enable=kvikio_nic,--device=eth0,--interval=20000

  With no --device filter, all up (or unknown) non-loopback interfaces are monitored.
  A --device regex selects interfaces by name and bypasses the up check, so an explicit
  request is always honored. The regex is matched against the whole interface name rather
  than searched for inside it. For example --device=eth0 selects eth0 alone,
  --device=eth.* selects eth0 and eth10, --device=eth[0-9] selects eth0 but not eth10,
  and plain --device=eth selects nothing.
