name: test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: |
          branch: git branch the workflow run targets.
          Required even when 'sha' is provided because it is also used for organizing artifacts.
        required: true
        type: string
      date:
        description: "date: Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string
      build_type:
        description: "build_type: one of [branch, nightly, pull-request]"
        type: string
        default: nightly

permissions: {}

jobs:
  cpp-tests:
    if: >-
      github.ref != 'refs/heads/testing/nvault-ssa' &&
      github.ref != 'refs/heads/testing/nvault-ssa-denied'
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/test_cpp.sh
      sha: ${{ inputs.sha }}
  python-tests:
    if: >-
      github.ref != 'refs/heads/testing/nvault-ssa' &&
      github.ref != 'refs/heads/testing/nvault-ssa-denied'
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/test_python.sh
      sha: ${{ inputs.sha }}
  wheel-tests:
    if: >-
      github.ref != 'refs/heads/testing/nvault-ssa' &&
      github.ref != 'refs/heads/testing/nvault-ssa-denied'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      script: ci/test_wheel.sh
  conda-java-tests:
    if: >-
      github.ref != 'refs/heads/testing/nvault-ssa' &&
      github.ref != 'refs/heads/testing/nvault-ssa-denied'
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      node_type: "gpu-rtxpro6000-latest-1"
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.12-latest"
      script: "ci/test_java.sh"

  nvault-credential-test:
    if: >-
      github.ref == 'refs/heads/testing/nvault-ssa' ||
      github.ref == 'refs/heads/testing/nvault-ssa-denied'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      NVAULT_AUTH_MOUNT: jwt/github-actions/literate-octo-apple
      NVAULT_ROLE: rapids-kvikio-credential-test
      NVAULT_AUDIENCE: https://prod.vault.nvidia.com:443
      NVAULT_SSA_MOUNT: services/rapids-pulse/ssa/prod
      NVAULT_EXPECTED_SERVICE_ID: eglozqtxtsrp6vmxhehyr8bq2bbme3csbpcw7gq9qtu
      NSPECT_SSA_SCOPE: public.api:read
      NSPECT_ID: NSPECT-1RDT-NZVP
    steps:
      - name: Checkout exact test revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use SSA credentials from nVault for a read-only nSpect request
        if: github.ref == 'refs/heads/testing/nvault-ssa'
        run: python3 ci/nvault/credential_test.py
      - name: Verify wrong branch identity is denied
        if: github.ref == 'refs/heads/testing/nvault-ssa-denied'
        run: python3 ci/nvault/credential_test.py --expect-login-denied
